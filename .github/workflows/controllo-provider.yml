# Controllo settimanale dei provider: indirizzi raggiungibili, chiamate dal pannello accettate (CORS con
# origine, metodo e intestazioni) e, se nei segreti del repository ci sono chiavi (KEY_GEMINI, KEY_OPENAI,
# KEY_CLAUDE, KEY_QWEN, KEY_MINIMAX, KEY_DEEPSEEK, KEY_OPENROUTER; tutte facoltative), modelli del catalogo.
# Due job separati: il controllo vede i segreti ma non puo' scrivere; la segnalazione puo' aprire issue
# ma non vede i segreti. Action fissate a commit (SHA) per non dipendere da tag spostabili.
name: Controllo provider

on:
  schedule:
    - cron: '17 6 * * 1'   # ogni lunedi', 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      esito: ${{ steps.controllo.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: '22'
      - name: Controlla i provider
        id: controllo
        continue-on-error: true
        env:
          KEY_GEMINI: ${{ secrets.KEY_GEMINI }}
          KEY_OPENAI: ${{ secrets.KEY_OPENAI }}
          KEY_CLAUDE: ${{ secrets.KEY_CLAUDE }}
          KEY_QWEN: ${{ secrets.KEY_QWEN }}
          KEY_MINIMAX: ${{ secrets.KEY_MINIMAX }}
          KEY_DEEPSEEK: ${{ secrets.KEY_DEEPSEEK }}
          KEY_OPENROUTER: ${{ secrets.KEY_OPENROUTER }}
        run: node scripts/controllo-provider.cjs > report.md
      - name: Riepilogo
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: report-provider
          path: report.md
          retention-days: 7

  segnalazione:
    needs: controllo
    if: needs.controllo.outputs.esito == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: report-provider
      - name: Apri o aggiorna la segnalazione
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Controllo provider: qualcosa e' cambiato"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body-file report.md
          else gh issue create --title "$title" --body-file report.md; fi
          exit 1
